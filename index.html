<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VibeTok</title>
<style>
body {
  margin: 0;
  background: #101010;
  color: white;
  font-family: Arial;
  text-align: center;
}
header {
  padding: 20px;
  color: #ff286b;
  font-size: 30px;
  font-weight: bold;
}
.video {
  margin: 20px;
  padding: 60px 10px;
  background: #252525;
  border-radius: 15px;
}
button {
  background: #ff286b;
  color: white;
  border: 0;
  padding: 14px 25px;
  border-radius: 25px;
  font-size: 17px;
}
input { margin: 20px; }
</style>
</head>
<body>
<header>❤️ VibeTok</header>
<h2>Feel the Vibe. Share the Vibe.</h2>
<div class="video">
  <h2>Welcome to VibeTok!</h2>
  <p>Your world. Your videos. Your vibe.</p>
  <input type="file" accept="video/*">
</div>
<button onclick="alert('Welcome to VibeTok!')">Get Started</button>
<p>© 2026 VibeTok</p>
</body>
</html>
